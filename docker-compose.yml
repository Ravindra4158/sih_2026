services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      MONGODB_URI: mongodb://database:27017
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    ports: ["${VERIFYDOC_HTTP_PORT:-80}:80"]
    depends_on:
      backend:
        condition: service_healthy
  database:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: border_screening
    volumes: ["mongodb_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  mongodb_data:
