[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-border-screening"
version = "0.1.0"
description = "Hackathon scaffold for AI-based identity and document screening"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "Pillow>=10.0,<12.0",
  "pytesseract>=0.3.10,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.3,<3.0",
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
ml = ["opencv-python-headless>=4.10,<5.0", "numpy>=1.26,<3.0", "mrz>=0.6,<1.0", "deepface>=0.0.90,<1.0", "mediapipe>=0.10,<1.0"]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
